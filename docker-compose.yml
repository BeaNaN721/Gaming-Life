services:
  db:
    image: mariadb:11
    container_name: gaming-life-db
    restart: unless-stopped
    ports: 
      - "3306:3306"
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpass}
      MARIADB_DATABASE: ${DB_NAME:-gaming-life}
      MARIADB_USER: ${DB_USER:-gaming-life}
      MARIADB_PASSWORD: ${DB_PASSWORD:-gaming-life}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:4
    container_name: gaming-life-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on: 
      db:
        condition: service_healthy

volumes:
  db_data:
      